apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 15s
  timeout: 2m

  path: ./k8s-manifests/platform/cert-manager/issuers
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: cert-manager