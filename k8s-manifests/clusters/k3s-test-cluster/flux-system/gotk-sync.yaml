apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 30s
  ref:
    branch: main
  url: https://github.com/roman-yaryzhenko/k3s-testwork
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s-manifests/clusters/k3s-test-cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
