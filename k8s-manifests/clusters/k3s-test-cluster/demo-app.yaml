apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-app
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 15s
  timeout: 2m

  path: ./k8s-manifests/app
  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: cert-manager-issuers

  decryption:
    provider: sops
    secretRef:
      name: sops-age

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: auth-svc
      namespace: devops-test

    - apiVersion: apps/v1
      kind: Deployment
      name: catalog-svc
      namespace: devops-test

    - apiVersion: apps/v1
      kind: Deployment
      name: order-svc
      namespace: devops-test
